name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

  local-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kubernetes local tools
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo ./kubectl "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Set up local environment
        run: make setup-env

      - name: Start local API
        run: |
          make run-api > /tmp/miniten-api.log 2>&1 &
          echo $! > /tmp/miniten-api.pid

      - name: Run local API smoke tests
        run: make test-local-apis

      - name: Run local Kubernetes smoke tests
        run: make test-local-k8s

      - name: Run local vLLM smoke tests
        run: make test-local-vllm

      - name: Run local Truss vLLM smoke tests
        run: make test-local-truss-vllm

      - name: Print API logs on failure
        if: failure()
        run: cat /tmp/miniten-api.log || true

      - name: Print worker logs on failure
        if: failure()
        run: docker compose logs worker || true

      - name: Print Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true

      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/miniten-api.pid ]; then
            kill "$(cat /tmp/miniten-api.pid)" || true
          fi

      - name: Clean local environment
        if: always()
        run: make clean-env
