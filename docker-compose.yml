services:
  postgres:
    # Local development database used by Flask and app.db.migrate.
    image: postgres:16
    environment:
      POSTGRES_DB: miniten
      POSTGRES_USER: miniten
      POSTGRES_PASSWORD: miniten
    ports:
      - "5432:5432"
    volumes:
      # Keep local database data across container restarts.
      - postgres_data:/var/lib/postgresql/data

  api:
    # Flask API/dashboard process. Build this after `poetry lock` is current.
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://miniten:miniten@postgres:5432/miniten
      SECRET_KEY: dev-secret-key-change-me-32-bytes
      API_KEY_HASH_SECRET: dev-api-key-hash-secret-change-me-32-bytes
      WEB_CONCURRENCY: 2
      VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
      VLLM_CPU_IMAGE: ${VLLM_CPU_IMAGE:-vllm/vllm-openai-cpu:latest-x86_64}
      VLLM_CPU_MEMORY_UTILIZATION: ${VLLM_CPU_MEMORY_UTILIZATION:-0.15}
      K8S_SMOKE_TEST_IMAGE: ${K8S_SMOKE_TEST_IMAGE:-python:3.12-alpine}
      K8S_SMOKE_TEST_MODEL_ID: ${K8S_SMOKE_TEST_MODEL_ID:-miniten/smoke-openai-compatible}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "2",
        "wsgi:app",
      ]

  worker:
    # Local deployment worker. Multiple workers can process different models,
    # but this Compose service is normally kept at one replica for predictable
    # local logs and resource usage.
    build: .
    network_mode: host
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://miniten:miniten@127.0.0.1:5432/miniten
      SECRET_KEY: dev-secret-key-change-me-32-bytes
      API_KEY_HASH_SECRET: dev-api-key-hash-secret-change-me-32-bytes
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2.0}
      WORKER_DRY_RUN: ${WORKER_DRY_RUN:-false}
      VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
      VLLM_CPU_IMAGE: ${VLLM_CPU_IMAGE:-vllm/vllm-openai-cpu:latest-x86_64}
      VLLM_CPU_MEMORY_UTILIZATION: ${VLLM_CPU_MEMORY_UTILIZATION:-0.15}
      K8S_SMOKE_TEST_IMAGE: ${K8S_SMOKE_TEST_IMAGE:-python:3.12-alpine}
      K8S_SMOKE_TEST_MODEL_ID: ${K8S_SMOKE_TEST_MODEL_ID:-miniten/smoke-openai-compatible}
      HUGGING_FACE_TOKEN: ${HUGGING_FACE_TOKEN:-}
      VLLM_DEVICE: ${VLLM_DEVICE:-}
      LOCAL_KIND_GPU_DRIVER_MOUNT: ${LOCAL_KIND_GPU_DRIVER_MOUNT:-false}
      LOCAL_KIND_GPU_DRIVER_PATH: ${LOCAL_KIND_GPU_DRIVER_PATH:-/usr/local/nvidia/lib64}
      VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-}
      KUBECONFIG: /root/.kube/config
      LOG_LEVEL: INFO
    volumes:
      # For real Kubernetes mutations, set KUBECONFIG_DIR to your host kube
      # config directory. Dry-run local setup uses the ignored .local/kube dir.
      - ${KUBECONFIG_DIR:-./.local/kube}:/root/.kube:ro
    command: ["python", "-m", "app.services.deployment_worker"]

volumes:
  postgres_data:
